apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: student-platform
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend-service-account
      containers:
        - name: backend
          image: localhost:5000/student-platform-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: student-platform-config
                  key: NODE_ENV
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: student-platform-secret
                  key: MONGO_URI
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: student-platform-config
                  key: PORT
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: student-platform-secret
                  key: MONGO_USERNAME
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: student-platform-secret
                  key: MONGO_PASSWORD
            - name: GMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: student-platform-secret
                  key: GMAIL_USER
            - name: GMAIL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: student-platform-secret
                  key: GMAIL_APP_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: student-platform-secret
                  key: JWT_SECRET
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: student-platform-secret
                  key: ADMIN_EMAIL
                  optional: true
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: student-platform-config
                  key: FRONTEND_URL
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
